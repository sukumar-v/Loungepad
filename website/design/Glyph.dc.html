<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button glyph</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; flex-shrink: 0; height: {{size}}px; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: #F2F5FA; line-height: 1">
<sc-if value="{{isDisc}}" hint-placeholder-val="{{ true }}">
<span style="box-sizing: border-box; width: {{size}}px; height: {{size}}px; border-radius: 50%; background: {{fill}}; box-shadow: {{shadow}}; display: flex; align-items: center; justify-content: center; color: {{ink}}; font-weight: 700; font-size: {{fs}}px; letter-spacing: 0">{{text}}</span>
</sc-if>
<sc-if value="{{isShape}}" hint-placeholder-val="{{ false }}">
<span style="box-sizing: border-box; width: {{size}}px; height: {{size}}px; border-radius: 50%; background: {{fill}}; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.28); display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 40 40" width="{{size}}" height="{{size}}" style="display: block; color: {{shapeC}}" aria-hidden="true">
<path d="{{shapeD}}" fill="none" stroke="currentColor" stroke-width="{{shapeW}}" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
</sc-if>
<sc-if value="{{isKey}}" hint-placeholder-val="{{ false }}">
<span style="box-sizing: border-box; min-width: {{size}}px; height: {{kh}}px; padding: 0 {{kp}}px; border-radius: 7px; background: rgba(242,245,250,0.12); border: 1.5px solid rgba(242,245,250,0.5); box-shadow: inset 0 -3px 0 rgba(1,2,4,0.55); display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', Consolas, monospace; font-weight: 600; font-size: {{kfs}}px; color: #F2F5FA; white-space: nowrap">{{text}}</span>
</sc-if>
<sc-if value="{{isPill}}" hint-placeholder-val="{{ false }}">
<span style="box-sizing: border-box; min-width: {{pw}}px; height: {{ph}}px; padding: 0 {{pp}}px; border-radius: 999px; background: rgba(242,245,250,0.08); border: 1.5px solid rgba(242,245,250,0.45); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: {{pfs}}px; letter-spacing: 0.04em; color: #F2F5FA; white-space: nowrap">{{text}}</span>
</sc-if>
<sc-if value="{{isDpad}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 40 40" width="{{size}}" height="{{size}}" style="display: block; color: #F2F5FA" aria-hidden="true">
<rect x="15" y="2" width="10" height="12" rx="2" fill="currentColor" fill-opacity="{{dUp}}"></rect>
<rect x="15" y="26" width="10" height="12" rx="2" fill="currentColor" fill-opacity="{{dDown}}"></rect>
<rect x="2" y="15" width="12" height="10" rx="2" fill="currentColor" fill-opacity="{{dLeft}}"></rect>
<rect x="26" y="15" width="12" height="10" rx="2" fill="currentColor" fill-opacity="{{dRight}}"></rect>
<rect x="14" y="14" width="12" height="12" fill="currentColor" fill-opacity="0.26"></rect>
</svg>
</sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"btn":{"editor":"enum","default":"A","options":["A","B","X","Y","Menu","View","Guide","LB","RB","LT","RT","LS","RS","Dpad","DpadH","DpadV"]},"fam":{"editor":"enum","default":"xbox","options":["xbox","playstation","switch","keyboard"]},"size":{"editor":"int","default":28,"min":12,"max":120},"label":{"editor":"text","default":""},"$preview":{"width":72,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const fam = this.props.fam ?? 'xbox';
    const btn = this.props.btn ?? 'A';
    const size = Number(this.props.size ?? 28) || 28;
    const label = this.props.label ?? '';
    const RING = 'inset 0 0 0 1.5px rgba(255,255,255,0.28)';
    const DARK = '#26262C';
    const SW = '#1B1B1F';
    // The same drawings the launcher uses (ui/glyphs.js): the A on an Xbox pad is a green disc,
    // on a DualSense a cross, on a Switch Pro the B that sits where an Xbox A does.
    const PATHS = {
      cross: ['M13.5 13.5l13 13M26.5 13.5l-13 13', '#7C9BE6', 3.2],
      circle: ['M27.5 20a7.5 7.5 0 1 1-15 0a7.5 7.5 0 1 1 15 0z', '#E0554F', 3.2],
      square: ['M14 12.5h12a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H14a1.5 1.5 0 0 1-1.5-1.5V14a1.5 1.5 0 0 1 1.5-1.5z', '#E68AC0', 3.2],
      triangle: ['M20 11.5 28.8 26.5H11.2z', '#63C58F', 3.2],
      lines: ['M12.5 14h15M12.5 20h15M12.5 26h15', '#FFFFFF', 2.4],
      plus: ['M12 20h16M20 12v16', '#FFFFFF', 3],
      minus: ['M12 20h16', '#FFFFFF', 3],
      home: ['M11 19.5 20 11.5l9 8V28a1 1 0 0 1-1 1h-5.5v-6h-5v6H12a1 1 0 0 1-1-1z', '#FFFFFF', 2],
    };
    const disc = (fill, text, ink, ring) => ({ kind: 'disc', fill, text, ink, shadow: ring ? RING : 'none' });
    const shape = (name, fill) => ({ kind: 'shape', fill: fill || DARK, shape: name });
    const key = (t) => ({ kind: 'key', text: t });
    const pill = (t) => ({ kind: 'pill', text: t });
    const ART = {
      xbox: {
        A: disc('#3AA03C', 'A', '#FFFFFF'), B: disc('#D3433C', 'B', '#FFFFFF'),
        X: disc('#3C7CD3', 'X', '#FFFFFF'), Y: disc('#E2B128', 'Y', '#101012'),
        Menu: shape('lines'), View: pill('VIEW'), Guide: pill('XBOX'),
        LB: pill('LB'), RB: pill('RB'), LT: pill('LT'), RT: pill('RT'), LS: pill('LS'), RS: pill('RS'),
      },
      playstation: {
        A: shape('cross'), B: shape('circle'), X: shape('square'), Y: shape('triangle'),
        Menu: pill('OPTIONS'), View: pill('CREATE'), Guide: disc(DARK, 'PS', '#FFFFFF', true),
        LB: pill('L1'), RB: pill('R1'), LT: pill('L2'), RT: pill('R2'), LS: pill('L3'), RS: pill('R3'),
      },
      switch: {
        A: disc(SW, 'B', '#FFFFFF', true), B: disc(SW, 'A', '#FFFFFF', true),
        X: disc(SW, 'Y', '#FFFFFF', true), Y: disc(SW, 'X', '#FFFFFF', true),
        Menu: shape('plus', SW), View: shape('minus', SW), Guide: shape('home', SW),
        LB: pill('L'), RB: pill('R'), LT: pill('ZL'), RT: pill('ZR'), LS: pill('LS'), RS: pill('RS'),
      },
      keyboard: {
        A: key('Enter'), B: key('Esc'), X: key('X'), Y: key('Y'),
        Menu: key('M'), View: key('/'), Guide: key('M'),
        LB: key('['), RB: key(']'), LT: key('LT'), RT: key('RT'), LS: key('LS'), RS: key('RS'),
      },
    };
    let g;
    if (label) g = fam === 'keyboard' ? key(label) : pill(label);
    else if (btn === 'Dpad' || btn === 'DpadH' || btn === 'DpadV') {
      if (fam === 'keyboard') g = key(btn === 'DpadH' ? '← →' : btn === 'DpadV' ? '↑ ↓' : '↑↓←→');
      else g = { kind: 'dpad', arms: btn === 'DpadH' ? 'h' : btn === 'DpadV' ? 'v' : 'all' };
    } else {
      const set = ART[fam] || ART.xbox;
      g = set[btn] || ART.xbox[btn] || pill(btn);
    }
    const text = String(g.text || '');
    const shp = g.kind === 'shape' ? (PATHS[g.shape] || PATHS.lines) : null;
    const lit = (a) => {
      if (g.arms === 'all') return 0.95;
      if (g.arms === 'v') return (a === 'up' || a === 'down') ? 0.95 : 0.26;
      if (g.arms === 'h') return (a === 'left' || a === 'right') ? 0.95 : 0.26;
      return 0.26;
    };
    return {
      size,
      isDisc: g.kind === 'disc', isShape: g.kind === 'shape', isKey: g.kind === 'key',
      isPill: g.kind === 'pill', isDpad: g.kind === 'dpad',
      fill: g.fill || DARK, text, ink: g.ink || '#FFFFFF', shadow: g.shadow || 'none',
      fs: Math.round(size * (text.length > 1 ? 0.4 : 0.54)),
      shapeD: shp ? shp[0] : '', shapeC: shp ? shp[1] : '#FFFFFF', shapeW: shp ? shp[2] : 3,
      kh: Math.round(size * 0.86), kp: Math.round(size * 0.24),
      kfs: Math.round(size * (text.length > 2 ? 0.36 : 0.46)),
      ph: Math.round(size * 0.72), pw: Math.round(size * 1.1), pp: Math.round(size * 0.28),
      pfs: Math.round(size * (text.length > 3 ? 0.3 : 0.38)),
      dUp: lit('up'), dDown: lit('down'), dLeft: lit('left'), dRight: lit('right'),
    };
  }
}
</script>
</body>
</html>
