# Still named for the app's old name on purpose. The name IS the URL
# (consolify-metadata.<subdomain>.workers.dev), every shipped build has that URL baked into
# MetadataProxyClient.DefaultEndpoint, and a renamed worker is a new worker with no secrets set.
# Renaming means: deploy under the new name, set the secrets again, ship a build pointing at it,
# and keep this one up until nobody runs a build that points here.
name = "consolify-metadata"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# The cache, and the reason this service can stay inside IGDB's 4 requests/second across every
# Loungepad user at once. A D1 table since Oct 8 2026 (why: "cache" in src/worker.js).
#
# Two different names here, and only one of them is global:
#
#   binding        how the worker code refers to it, as env.CACHE. Scoped to this worker.
#   database_name  its name in your Cloudflare account, shared with every other Worker you ever
#                  deploy, so it is specific.
#
#   npx wrangler d1 create loungepad-metadata-cache
#
# then paste the id it prints in below, and make the table (migrations/0001_cache.sql):
#
#   npx wrangler d1 migrations apply loungepad-metadata-cache --remote --config proxy/wrangler.toml
[[d1_databases]]
binding = "CACHE"
database_name = "loungepad-metadata-cache"
database_id = "b96f1bd4-65d1-4b7b-b3a5-ee3c67a56e90"

# The cache before D1, read-only now: answers it already holds are still served when D1 has none,
# and nothing is written to it. Its entries expire by themselves within 30 days of the last write
# (Oct 8 2026), so after Nov 8 2026 this binding and the fallback in cacheGet can both go.
[[kv_namespaces]]
binding = "METADATA"
id = "d7caac270d6543ebb25ca428d26075f6"

# The per-address cap on cache misses (rateLimited in src/worker.js), counted by Cloudflare rather
# than in a store of our own. namespace_id is any number unique within the account. period can only
# be 10 or 60, and RATE_WINDOW in the worker has to match it: it is the Retry-After.
[[ratelimits]]
name = "MISS_LIMIT"
namespace_id = "1001"
simple = { limit = 240, period = 60 }

# Once a day: delete the cache's expired rows (D1 keeps a row until told otherwise).
[triggers]
crons = ["17 4 * * *"]

# Credentials are NOT set here -- this file is committed. They are set once, encrypted, with:
#   npx wrangler secret put IGDB_CLIENT_ID
#   npx wrangler secret put IGDB_CLIENT_SECRET
#   npx wrangler secret put SGDB_KEY
# STEAM_API_KEY is no longer read: the routes that used it (/v1/owned, /v1/achievements) are gone.
# Delete it with `npx wrangler secret delete STEAM_API_KEY` if it is still set.

# Workers Logs keeps the worker's own console output. Invocation logs are off: they record every
# request's URL, which is a game title or app id from somebody's library, and there is nothing in
# them a console line does not say better.
[observability]
enabled = true
[observability.logs]
enabled = true
invocation_logs = false
