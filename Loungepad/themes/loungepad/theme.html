<!-- Loungepad — the launcher's own look.

     One page. At the top of it the focused game's art fills the screen (and its trailer,
     once the highlight has rested on it) and the recents sit in a row near the bottom,
     with the top of the grid just peeking under it. The first move down -- the D-pad, the
     stick or a wheel -- takes the whole page up until the grid fills the view, and the art
     dims behind it; from there it scrolls like any page, and the recents come back as a row
     on the way up.

     There is no script here — a theme cannot run any. The look is entirely CSS, hanging
     off .scrolled, which the app puts on the page's scroller while it is away from the
     top. See theme.css. -->

<template data-template="screen-library">
  <div class="tv">
    <div class="tv-chrome" data-slot="topbar"></div>

    <!-- The page, and the library's only scroller. At the top of it everything below the
         dock is under the fold, which is what makes the peek a peek. -->
    <div class="tv-view">
      <div class="tv-stack">
        <div class="tv-hero">
          <div class="tv-hero-text" data-slot="focus-detail"></div>
          <div class="tv-hero-playing" data-slot="playing"></div>
        </div>

        <div class="tv-dock" data-slot="continue"></div>
        <div class="tv-shelf" data-slot="grid"></div>
      </div>
    </div>

    <div class="tv-foot" data-slot="legend"></div>
  </div>
</template>

<!-- A tile is a landscape sheet of art and nothing else. The title appears underneath
     only while the tile is focused, so a screenful of them stays quiet.

     {{banner}} already falls back to the cover when a game has no banner, and the
     initials sit behind the art so a game with neither still reads as something. -->
<template data-template="game-tile">
  <div class="tv-tile">
    <div class="tv-art">
      <span class="tv-initials">{{initials}}</span>
      <!-- The same picture, blurred, filling the box behind the fitted one. Art that is not
           1.75:1 does not reach the top and bottom edges, and what it leaves should be a mat
           made of the game's own colours rather than two black bars. -->
      <div class="tv-bed" style="background-image:url({{banner}})"></div>
      <div class="tv-img" style="background-image:url({{banner}})"></div>
      <span class="tv-star" data-if="favorite">★</span>
      <span class="tv-off" data-unless="installed">NOT INSTALLED</span>
      <!-- The unlocked share, on the tile you are on only, like the caption. -->
      <span class="tv-ach" data-if="achievements">{{achPercent}}%</span>
    </div>
    <div class="tv-name">{{title}}</div>
  </div>
</template>

<template data-template="continue-tile">
  <div class="tv-tile">
    <div class="tv-art">
      <span class="tv-initials">{{initials}}</span>
      <div class="tv-bed" style="background-image:url({{banner}})"></div>
      <div class="tv-img" style="background-image:url({{banner}})"></div>
      <span class="tv-star" data-if="favorite">★</span>
      <span class="tv-ach" data-if="achievements">{{achPercent}}%</span>
    </div>
    <div class="tv-name">{{title}}</div>
  </div>
</template>
