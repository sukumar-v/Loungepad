<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- YouTube's player script runs here and nowhere else. This page is served from its own origin
     (https://loungepad.player in the app), so the script has no bridge, no settings and no data
     host to reach: the launcher page drives it through postMessage (see player.js). The policy
     below names the two hosts the embed needs and nothing more. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; style-src 'unsafe-inline'; img-src https://i.ytimg.com data:; connect-src https://www.youtube.com">
<title>Loungepad player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p, #p iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="p"></div>
<script src="player.js"></script>
</body>
</html>
