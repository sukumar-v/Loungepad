<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loungepad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="backdrop">
  <div class="bd" id="bdA"></div>
  <div class="bd" id="bdB"></div>
  <!-- The focused game's trailer, faded up over the still once the highlight has rested on it.
       Between the art and the scrim a theme draws with #backdrop::after, so the same gradients
       that hold the title over a picture hold it over a film. See the trailers section of app.js. -->
  <video id="bdVideo" playsinline disablepictureinpicture preload="none"></video>
  <!-- The same film when it is a YouTube video (IGDB's trailers): YouTube's embedded player,
       replacing the inner div on first use, sized to cover the screen like the video above. -->
  <div id="bdYt" class="trailer-yt"><div id="bdYtHost"></div></div>
</div>

<!-- Still of the desktop or the game, captured by the host just before an overlay menu opens.
     The window is opaque, so this is what "you can see what is behind the menu" is made of. -->
<div id="overlayShot"></div>

<div id="stage">

  <!-- ============ LIBRARY ============ -->
  <div class="screen" id="screen-library" data-focus-scope>
    <header class="topbar" data-region="topbar">
      <div class="topbar-left" data-tabbar="library"></div>
      <!-- Search. In the top bar rather than over the grid because every theme slots the top bar,
           and the Loungepad theme hides the section headings. View opens it; see openSearch in app.js. -->
      <label class="lib-search" id="libSearch" data-focusable data-nav-skip data-focus-key="search" data-action="search">
        <svg class="lib-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20.5 20.5"/></svg>
        <input id="searchField" type="text" placeholder="Search your library" autocomplete="off" spellcheck="false" tabindex="-1">
        <span class="lib-search-key btn-slot" data-btn="View"></span>
      </label>
      <div class="topbar-right mono">
        <span id="scanStatus"></span>
        <span id="titleCount">0 TITLES</span>
        <span class="vsep"></span>
        <span id="padBattery" class="pad-status"></span>
        <span class="vsep"></span>
        <span class="clock">—</span>
      </div>
    </header>

    <div class="lib-body">
      <section class="lib-section playing-section" id="playingSection" data-region="playing" style="display:none">
        <div class="section-head">
          <div class="section-title">Playing</div>
          <div class="section-label mono">RUNNING NOW</div>
        </div>
        <div class="playing-card" id="playingCard" data-focusable data-focus-key="playing">
          <div class="playing-art" id="playingArt"></div>
          <div class="playing-info">
            <div class="playing-name" id="playingName">—</div>
            <div class="playing-meta mono" id="playingMeta"></div>
            <div class="playing-hint"><span class="btn-slot" data-btn="A"></span><span>Resume</span><span class="btn-slot" data-btn="Y"></span><span>Options</span></div>
          </div>
        </div>
      </section>

      <section class="lib-section" id="continueSection" data-region="continue">
        <div class="section-head">
          <div class="section-title">Continue</div>
          <div class="section-label mono">RECENTLY PLAYED</div>
        </div>
        <div class="continue-row" id="continueRow" data-dim-group></div>
      </section>

      <!-- Opt-in: hidden until a theme gives it a slot. The app keeps it filled with whatever
           the highlight is on, so a console-style layout can show the focused game large
           without the app having to know that is what the theme is doing. -->
      <section class="focus-detail" data-region="focus-detail" hidden>
        <div class="fd-logo" id="fdTitle">—</div>
        <div class="fd-meta mono" id="fdMeta"></div>
        <div class="fd-desc" id="fdDesc"></div>
        <div class="fd-stats mono">
          <span id="fdPlaytime"></span>
          <span id="fdLastPlayed"></span>
          <span id="fdSize"></span>
        </div>
      </section>

      <section class="lib-section lib-grid-section" data-region="grid">
        <div class="section-head">
          <div class="section-title">All games</div>
          <div class="section-label mono" id="gridLabel">0 TITLES</div>
        </div>
        <div class="grid-scroll" id="gridScroll"></div>
      </section>
    </div>

    <!-- Filled by renderLibraryLegend: the buttons are drawn for whatever pad (or keyboard) was
         last used, so nothing here can be static markup. -->
    <footer class="legend" data-region="legend" id="libraryFoot"></footer>
  </div>

  <!-- ============ DETAIL ============ -->
  <div class="screen" id="screen-detail" data-focus-scope>
    <div class="detail-art" id="detailArt"></div>
    <!-- The trailer, over the art and under the shades, on the same three-second clock. -->
    <video id="detailVideo" class="detail-video" playsinline disablepictureinpicture preload="none"></video>
    <div id="detailYt" class="trailer-yt detail-yt"><div id="detailYtHost"></div></div>
    <div class="detail-shade-x"></div>
    <div class="detail-shade-y"></div>

    <div class="detail-content">
      <div class="detail-top">
        <div class="crumb mono"><span>LIBRARY</span><span>/</span><span class="crumb-here" id="detailCrumb">STEAM</span></div>
        <!-- Where the game came from, opposite the breadcrumb that says the same thing in words. -->
        <div class="detail-platform" id="detailPlatform"></div>
      </div>

      <div class="detail-main">
        <div class="detail-titleblock">
          <!-- The game's own wordmark when we have one, the title as text when we do not. Both
               are always in the DOM; renderDetail shows whichever applies. -->
          <div class="detail-logo" id="detailLogo" hidden></div>
          <h1 id="detailTitleRow"><span id="detailFav" class="fav-star" style="display:none">★</span><span id="detailTitle">—</span></h1>
          <div class="detail-facts" id="detailFacts"></div>
          <p id="detailDesc"></p>
          <!-- Why the board rated it what it did, in the board's own words. Empty for most
               games, and collapsed by :empty when it is. -->
          <div class="detail-descriptors" id="detailDescriptors"></div>
          <!-- The gallery: the trailer, then the store page's other films and its screenshots.
               Built by renderDetailMedia and hidden for a game with nothing. Walking along it
               changes the picture behind the page; A opens the item in the viewer. -->
          <div class="media-strip" id="detailMedia" hidden><div class="media-track" id="detailMediaTrack"></div></div>
        </div>

        <!-- Ratings above the hairline, the numbers we know about it below. Both are facts you
             would check before starting something, so they read as one block -- and what somebody
             else thought of the game sits with the rest of the evidence rather than off on its
             own in a corner. -->
        <div class="detail-numbers">
          <div class="detail-ratings" id="detailRatings"></div>
          <div class="detail-stats" id="detailStats"></div>
        </div>

        <div class="detail-actions" id="detailActions">
          <div class="pill-btn pill-primary" data-act="play" data-focusable data-focus-key="detail:play">
            <div class="pill-a-badge btn-slot" data-btn="A"></div>
            <span id="playLabel">Play</span>
          </div>
          <div class="pill-btn pill-secondary" data-act="collect" data-focusable data-focus-key="detail:collect">Add to Collection</div>
          <div class="pill-btn pill-secondary" data-act="manage" data-focusable data-focus-key="detail:manage">Manage</div>
        </div>
      </div>

      <footer class="legend" id="detailFoot"></footer>
    </div>
  </div>

  <!-- ============ SETTINGS ============
       A box over the library rather than a screen of its own: the library stays drawn behind it,
       blurred, so Settings reads as something you opened rather than somewhere you went. -->
  <div class="screen" id="screen-settings" data-focus-scope>
    <div class="settings-box">
      <header class="topbar">
        <div class="settings-title">Settings</div>
        <div class="topbar-left" data-tabbar="settings"></div>
        <div class="topbar-right mono">
          <span class="clock">—</span>
        </div>
      </header>

      <div class="settings-body">
        <!-- Categories, so one screen is not a wall of every setting at once. Driven by LB/RB and
             by clicking; the rows to the right are only ever the active category. -->
        <nav class="settings-nav" id="settingsNav"></nav>
        <div class="settings-scroll" id="settingsScroll"></div>
      </div>

      <footer class="legend" id="settingsFoot"></footer>
    </div>
  </div>

  <!-- ============ FILTER & SORT ============ -->
  <div class="overlay" id="overlay-filter" data-focus-scope>
    <div class="quick-card filter-card">
      <div class="quick-title mono" id="filterTitle">FILTER &amp; SORT</div>
      <div class="ov-scroll" id="filterList"></div>
      <div class="ov-foot" id="filterFoot"></div>
    </div>
  </div>

  <!-- ============ GAME CONTEXT MENU ============ -->
  <div class="overlay" id="overlay-gamemenu" data-focus-scope>
    <div class="quick-card menu-card">
      <div class="quick-title mono" id="gameMenuTitle">GAME</div>
      <div class="ov-scroll" id="gameMenuList"></div>
      <div class="ov-foot" id="gameMenuFoot"></div>
    </div>
  </div>

  <!-- ============ ADD TO COLLECTION ============ -->
  <div class="overlay" id="overlay-collect" data-focus-scope>
    <div class="quick-card menu-card">
      <div class="quick-title mono">ADD TO COLLECTION</div>
      <div class="ov-scroll" id="collectList"></div>
      <div class="ov-foot" id="collectFoot"></div>
    </div>
  </div>

  <!-- ============ MANAGE ============ -->
  <div class="overlay" id="overlay-manage" data-focus-scope>
    <div class="quick-card menu-card">
      <div class="quick-title mono">MANAGE</div>
      <div class="ov-scroll" id="manageList"></div>
      <div class="ov-foot" id="manageFoot"></div>
    </div>
  </div>

  <!-- ============ THE VIEWER ============
       One item of a game's gallery, whole, on black: a picture, or a film with the pad on it.
       Driven by mediaViewInput; the bar carries the name, the count and the buttons. -->
  <div class="overlay media-view" id="overlay-media">
    <div class="media-view-stage">
      <div class="media-view-img" id="mediaViewImg"></div>
      <video id="mediaViewVideo" class="media-view-video" playsinline disablepictureinpicture preload="none"></video>
      <div id="mediaViewYt" class="media-view-yt"><div id="mediaViewYtHost"></div></div>
    </div>
    <div class="media-view-progress" id="mediaViewProgress" hidden><i></i></div>
    <div class="media-view-bar">
      <div class="media-view-caption mono"><span id="mediaViewName"></span><span id="mediaViewCount"></span></div>
      <div class="legend" id="mediaViewFoot"></div>
    </div>
  </div>

  <!-- ============ MODS ============
       One game's mods, through Vortex. The note above the list carries whatever state is not a
       list -- Vortex missing, needing a restart, the game not set up yet -- and the rows under it
       are what can be done about that. Wider than a menu: a mod's name and its version and author
       are three things, and they have to fit beside a toggle. -->
  <div class="overlay" id="overlay-mods" data-focus-scope>
    <div class="quick-card menu-card mods-card">
      <div class="quick-title mono" id="modsTitle">MODS</div>
      <div class="mods-note" id="modsNote" hidden></div>
      <div class="ov-scroll mods-scroll" id="modsList"></div>
      <div class="ov-foot" id="modsFoot"></div>
    </div>
  </div>

  <!-- ============ CHOICE ============
       A general pick-one list: which system a ROM folder is for, which emulator runs it, what
       to do with an emulator. Same card as Manage; the title and rows come from the caller. -->
  <div class="overlay" id="overlay-choice" data-focus-scope>
    <div class="quick-card menu-card">
      <div class="quick-title mono" id="choiceTitle">CHOOSE</div>
      <div class="ov-scroll" id="choiceList"></div>
      <div class="ov-foot" id="choiceFoot"></div>
    </div>
  </div>

  <!-- ============ CONFIRM ============ -->
  <!-- A dialog rather than a menu: the details, then A to go ahead and B to back out. -->
  <div class="overlay" id="overlay-confirm">
    <div class="dialog" id="confirmDialog" role="alertdialog" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
      <div class="dialog-icon" id="confirmIcon"></div>
      <div class="dialog-title" id="confirmTitle">Are you sure?</div>
      <div class="dialog-body" id="confirmBody"></div>
      <div class="dialog-actions">
        <div class="dialog-btn dialog-yes" id="confirmYes"><span class="btn-slot" data-btn="A"></span><span id="confirmYesLabel">Confirm</span></div>
        <div class="dialog-btn dialog-no" id="confirmNo"><span class="btn-slot" data-btn="B"></span><span>Cancel</span></div>
      </div>
    </div>
  </div>

  <!-- ============ POWER WHEEL ============ -->
  <div class="overlay" id="overlay-radial">
    <div class="radial-wrap">
      <div class="radial-title mono">POWER WHEEL</div>
      <div class="radial" id="radialRing"></div>
      <div class="radial-center">
        <div class="radial-sel" id="radialSelName">—</div>
        <div class="radial-desc" id="radialDesc"></div>
        <div class="radial-target mono" id="radialTarget"></div>
      </div>
      <div class="ov-foot radial-foot" id="radialFoot"></div>
    </div>
  </div>

  <!-- ============ RADIAL SUBMENU ============ -->
  <div class="overlay" id="overlay-radialsub" data-focus-scope>
    <div class="quick-card menu-card">
      <div class="quick-title mono" id="radialSubTitle">MENU</div>
      <div class="ov-scroll" id="radialSubList"></div>
      <div class="ov-foot" id="radialSubFoot"></div>
    </div>
  </div>

  <!-- ============ IN-GAME MENU ============
       A console-style bar along the bottom rather than a centred card, so as much of the
       paused game as possible stays visible above it. -->
  <div class="overlay" id="overlay-ingame">
    <div class="ingame-bar">
      <div class="ingame-head">
        <div class="ingame-title" id="ingameTitle">PLAYING</div>
        <div class="ingame-desc" id="ingameDesc"></div>
      </div>
      <div class="ingame-row" id="ingameList"></div>
      <div class="ov-foot ingame-foot" id="ingameFoot"></div>
    </div>
  </div>

  <!-- ============ TEXT INPUT ============ -->
  <div class="overlay" id="overlay-input">
    <div class="quick-card">
      <div class="quick-title mono" id="inputTitle">NAME</div>
      <input id="inputField" class="text-input" type="text" autocomplete="off" spellcheck="false">
      <div class="input-hint" id="inputHint"></div>
    </div>
  </div>

  <!-- ============ COUCH SETUP GUIDE ============ -->
  <div class="overlay" id="overlay-guide">
    <div class="guide-card">
      <div class="quick-title mono">COUCH SETUP GUIDE</div>
      <div class="guide-body" id="guideBody"></div>
      <div class="guide-foot"><div class="legend-item" data-press="B"><span class="btn-slot" data-btn="B"></span><span>Close</span></div></div>
    </div>
  </div>

  <div id="toast" class="mono"></div>
</div>

<script src="nav.js"></script>
<script src="theme.js"></script>
<!-- The icons and button pictures, before the app: the browse window's bar draws from the same file. -->
<script src="glyphs.js"></script>
<script src="app.js"></script>
<script src="radial.js"></script>
</body>
</html>
